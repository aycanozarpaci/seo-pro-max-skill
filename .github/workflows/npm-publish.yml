name: npm-publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # required for OIDC trusted publisher + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ($TAG) does not match package.json version ($PKG)."
            exit 1
          fi

      - name: Build platform files
        run: node scripts/build-platforms.mjs

      - name: Smoke-test CLI
        run: |
          node bin/seo-pro-max.js --version
          node bin/seo-pro-max.js --help
          node bin/seo-pro-max.js install --target all --dry-run --yes

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
